<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <style>
        .dashboardPage { background-color: #f5f6f7; }
        .kpiTile { margin: 0.25rem; }
        .barRow { display: flex; align-items: center; margin: 0.4rem 0.75rem; }
        .barLabel { min-width: 110px; font-size: 0.875rem; }
        .barTrack { flex: 1; height: 24px; background: #e8e8e8; border-radius: 4px; overflow: hidden; }
        .barFill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
        .barValue { min-width: 90px; text-align: right; font-size: 0.875rem; font-weight: bold; padding-left: 0.5rem; }
        .trendGrid { display: flex; align-items: flex-end; gap: 2px; height: 140px; padding: 0.5rem 0.75rem; }
        .trendCol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; height: 100%; justify-content: flex-end; }
        .trendBar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; }
        .trendBar.revenue { background: #0a6ed1; }
        .trendBar.profit { background: #107e3e; }
        .trendLabel { font-size: 0.7rem; color: #666; margin-top: 2px; }
        .donutLegend { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem 0.75rem; }
        .legendItem { display: flex; align-items: center; gap: 0.3rem; font-size: 0.8rem; }
        .legendDot { width: 12px; height: 12px; border-radius: 50%; }
        .sectionCard { margin: 0.5rem; background: #fff; border-radius: 0.75rem; box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden; }
        .sectionHeader { padding: 1rem 1rem 0.5rem 1rem; font-size: 1rem; font-weight: bold; color: #333; }
        .trendLegend { display: flex; gap: 1rem; padding: 0 0.75rem 0.5rem; font-size: 0.75rem; }
        .trendLegendItem { display: flex; align-items: center; gap: 0.25rem; }
        .trendLegendDot { width: 10px; height: 10px; border-radius: 2px; }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sdk.openui5.org/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m, sap.ui.layout, sap.ui.core"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-oninit="onUI5Ready">
    </script>
    <script>
        // ── Mock Data ──
        var DATA = {
            kpis: [
                { title: "Gesamtumsatz", value: "4.875.000,00", unit: "EUR", indicator: "+12,5%", trend: "Up", state: "Good" },
                { title: "Bestellungen", value: "12.450", unit: "Stk.", indicator: "+8,3%", trend: "Up", state: "Good" },
                { title: "\u00D8 Bestellwert", value: "391,57", unit: "EUR", indicator: "+3,9%", trend: "Up", state: "Good" },
                { title: "Kundenzufriedenheit", value: "4,3 / 5,0", unit: "", indicator: "+0,2 Pkt.", trend: "Up", state: "Good" }
            ],
            revenueByRegion: [
                { region: "Europa", revenue: 1650000, pct: 100, color: "#0a6ed1" },
                { region: "Nordamerika", revenue: 1380000, pct: 84, color: "#1a9898" },
                { region: "Asien-Pazifik", revenue: 980000, pct: 59, color: "#107e3e" },
                { region: "Lateinamerika", revenue: 520000, pct: 32, color: "#e9730c" },
                { region: "Naher Osten", revenue: 345000, pct: 21, color: "#bb0000" }
            ],
            monthlyTrend: [
                { m: "Jan", rev: 320000, profit: 96000 },
                { m: "Feb", rev: 350000, profit: 108500 },
                { m: "M\u00E4r", rev: 380000, profit: 117800 },
                { m: "Apr", rev: 410000, profit: 131200 },
                { m: "Mai", rev: 395000, profit: 122450 },
                { m: "Jun", rev: 430000, profit: 137600 },
                { m: "Jul", rev: 445000, profit: 146850 },
                { m: "Aug", rev: 420000, profit: 134400 },
                { m: "Sep", rev: 460000, profit: 151800 },
                { m: "Okt", rev: 480000, profit: 158400 },
                { m: "Nov", rev: 510000, profit: 173400 },
                { m: "Dez", rev: 475000, profit: 156750 }
            ],
            productCategories: [
                { cat: "Elektronik", share: 32, color: "#0a6ed1" },
                { cat: "Bekleidung", share: 20, color: "#1a9898" },
                { cat: "M\u00F6bel", share: 15, color: "#107e3e" },
                { cat: "Lebensmittel", share: 14, color: "#e9730c" },
                { cat: "Sport & Freizeit", share: 10, color: "#bb0000" },
                { cat: "Sonstiges", share: 9, color: "#7800a4" }
            ],
            salesDetails: [
                { orderId: "ORD-2025-001", date: "15.01.2025", customer: "TechCorp GmbH", region: "Europa", category: "Elektronik", product: "Server-Rack X500", quantity: 5, unitPrice: "12.000,00", totalAmount: "60.000,00", status: "Geliefert" },
                { orderId: "ORD-2025-002", date: "18.01.2025", customer: "Fashion House Inc.", region: "Nordamerika", category: "Bekleidung", product: "Designer Kollektion", quantity: 200, unitPrice: "85,00", totalAmount: "17.000,00", status: "Geliefert" },
                { orderId: "ORD-2025-003", date: "02.02.2025", customer: "Office Solutions AG", region: "Europa", category: "M\u00F6bel", product: "Ergonomie-Paket Pro", quantity: 50, unitPrice: "450,00", totalAmount: "22.500,00", status: "Geliefert" },
                { orderId: "ORD-2025-004", date: "14.02.2025", customer: "SportMax Ltd.", region: "Asien-Pazifik", category: "Sport & Freizeit", product: "Fitness-Set Premium", quantity: 120, unitPrice: "199,00", totalAmount: "23.880,00", status: "In Bearbeitung" },
                { orderId: "ORD-2025-005", date: "01.03.2025", customer: "Green Foods S.A.", region: "Lateinamerika", category: "Lebensmittel", product: "Bio-Sortiment Palette", quantity: 30, unitPrice: "580,00", totalAmount: "17.400,00", status: "Geliefert" },
                { orderId: "ORD-2025-006", date: "10.03.2025", customer: "DataSystems Corp.", region: "Nordamerika", category: "Elektronik", product: "Cloud-Server Package", quantity: 3, unitPrice: "25.000,00", totalAmount: "75.000,00", status: "Geliefert" },
                { orderId: "ORD-2025-007", date: "22.03.2025", customer: "Al Rashid Trading", region: "Naher Osten", category: "Elektronik", product: "Netzwerk-Bundle", quantity: 10, unitPrice: "3.200,00", totalAmount: "32.000,00", status: "Versandt" },
                { orderId: "ORD-2025-008", date: "05.04.2025", customer: "Home & Living KG", region: "Europa", category: "M\u00F6bel", product: "Wohnzimmer-Set Classic", quantity: 15, unitPrice: "1.800,00", totalAmount: "27.000,00", status: "Geliefert" },
                { orderId: "ORD-2025-009", date: "18.04.2025", customer: "Tokyo Electronics", region: "Asien-Pazifik", category: "Elektronik", product: "Display-Wand 4K", quantity: 8, unitPrice: "5.500,00", totalAmount: "44.000,00", status: "In Bearbeitung" },
                { orderId: "ORD-2025-010", date: "02.05.2025", customer: "Mode Zentrale AG", region: "Europa", category: "Bekleidung", product: "Sommer-Kollektion 2025", quantity: 500, unitPrice: "42,00", totalAmount: "21.000,00", status: "Versandt" },
                { orderId: "ORD-2025-011", date: "15.05.2025", customer: "FitLife Inc.", region: "Nordamerika", category: "Sport & Freizeit", product: "Yoga-Studio Ausstattung", quantity: 25, unitPrice: "890,00", totalAmount: "22.250,00", status: "Geliefert" },
                { orderId: "ORD-2025-012", date: "01.06.2025", customer: "Gourmet Express", region: "Europa", category: "Lebensmittel", product: "Premium Feinkost Box", quantity: 100, unitPrice: "125,00", totalAmount: "12.500,00", status: "Geliefert" }
            ]
        };

        function fmtEur(n) {
            return n.toLocaleString("de-DE") + " \u20AC";
        }

        function onUI5Ready() {
            sap.ui.require([
                "sap/m/Shell",
                "sap/m/App",
                "sap/m/Page",
                "sap/m/GenericTile",
                "sap/m/TileContent",
                "sap/m/NumericContent",
                "sap/ui/layout/Grid",
                "sap/m/Panel",
                "sap/ui/core/HTML",
                "sap/m/Table",
                "sap/m/Column",
                "sap/m/ColumnListItem",
                "sap/m/Text",
                "sap/m/ObjectNumber",
                "sap/m/ObjectStatus",
                "sap/m/SearchField",
                "sap/m/OverflowToolbar",
                "sap/m/ToolbarSpacer",
                "sap/ui/model/json/JSONModel",
                "sap/ui/model/Filter",
                "sap/ui/model/FilterOperator"
            ], function (Shell, App, Page, GenericTile, TileContent, NumericContent,
                         Grid, Panel, HTML, Table, Column, ColumnListItem, Text,
                         ObjectNumber, ObjectStatus, SearchField, OverflowToolbar,
                         ToolbarSpacer, JSONModel, Filter, FilterOperator) {

                var oModel = new JSONModel(DATA);

                // ── KPI Tiles ──
                var aKpiTiles = DATA.kpis.map(function (kpi) {
                    return new GenericTile({
                        header: kpi.title,
                        subheader: kpi.indicator,
                        tileContent: new TileContent({
                            content: new NumericContent({
                                value: kpi.value,
                                scale: kpi.unit,
                                valueColor: "Good",
                                indicator: kpi.trend
                            })
                        })
                    }).addStyleClass("kpiTile");
                });

                var oKpiGrid = new Grid({ defaultSpan: "XL3 L3 M6 S12", content: aKpiTiles });

                // ── Monthly Trend (HTML bar chart) ──
                var maxRev = 510000;
                var trendBars = DATA.monthlyTrend.map(function (d) {
                    var revH = Math.round((d.rev / maxRev) * 100);
                    var profH = Math.round((d.profit / maxRev) * 100);
                    return '<div class="trendCol">' +
                        '<div class="trendBar revenue" style="height:' + revH + '%" title="Umsatz: ' + fmtEur(d.rev) + '"></div>' +
                        '<div class="trendBar profit" style="height:' + profH + '%" title="Gewinn: ' + fmtEur(d.profit) + '"></div>' +
                        '<span class="trendLabel">' + d.m + '</span></div>';
                }).join("");

                var oTrendHtml = new HTML({
                    content: '<div class="sectionCard">' +
                        '<div class="sectionHeader">Monatlicher Umsatz- und Gewinntrend</div>' +
                        '<div class="trendLegend">' +
                            '<div class="trendLegendItem"><div class="trendLegendDot" style="background:#0a6ed1"></div>Umsatz</div>' +
                            '<div class="trendLegendItem"><div class="trendLegendDot" style="background:#107e3e"></div>Gewinn</div>' +
                        '</div>' +
                        '<div class="trendGrid">' + trendBars + '</div></div>'
                });

                // ── Revenue by Region (HTML horizontal bars) ──
                var regionBars = DATA.revenueByRegion.map(function (d) {
                    return '<div class="barRow">' +
                        '<span class="barLabel">' + d.region + '</span>' +
                        '<div class="barTrack"><div class="barFill" style="width:' + d.pct + '%;background:' + d.color + '"></div></div>' +
                        '<span class="barValue">' + fmtEur(d.revenue) + '</span></div>';
                }).join("");

                var oRegionHtml = new HTML({
                    content: '<div class="sectionCard">' +
                        '<div class="sectionHeader">Umsatz nach Region</div>' +
                        regionBars + '<div style="height:0.75rem"></div></div>'
                });

                // ── Product Categories (HTML horizontal bars with %) ──
                var catBars = DATA.productCategories.map(function (d) {
                    return '<div class="barRow">' +
                        '<span class="barLabel">' + d.cat + '</span>' +
                        '<div class="barTrack"><div class="barFill" style="width:' + d.share + '%;background:' + d.color + '"></div></div>' +
                        '<span class="barValue">' + d.share + ' %</span></div>';
                }).join("");

                var oCatHtml = new HTML({
                    content: '<div class="sectionCard">' +
                        '<div class="sectionHeader">Umsatz nach Produktkategorie</div>' +
                        catBars + '<div style="height:0.75rem"></div></div>'
                });

                var oChartsGrid = new Grid({
                    defaultSpan: "XL6 L6 M12 S12",
                    content: [oRegionHtml, oCatHtml]
                });

                // ── Sales Detail Table ──
                var oSearchField = new SearchField({ width: "300px", placeholder: "Suche..." });
                var oTable = new Table({
                    growing: true,
                    growingThreshold: 10,
                    alternateRowColors: true,
                    sticky: ["ColumnHeaders"],
                    headerToolbar: new OverflowToolbar({
                        content: [
                            new Text({ text: "Bestelldetails (" + DATA.salesDetails.length + ")" }).addStyleClass("sapMTitle"),
                            new ToolbarSpacer(),
                            oSearchField
                        ]
                    }),
                    columns: [
                        new Column({ width: "8rem", header: new Text({ text: "Bestell-Nr." }) }),
                        new Column({ width: "7rem", header: new Text({ text: "Datum" }) }),
                        new Column({ minScreenWidth: "Tablet", header: new Text({ text: "Kunde" }) }),
                        new Column({ minScreenWidth: "Tablet", width: "8rem", header: new Text({ text: "Region" }) }),
                        new Column({ minScreenWidth: "Desktop", width: "8rem", header: new Text({ text: "Kategorie" }) }),
                        new Column({ minScreenWidth: "Desktop", header: new Text({ text: "Produkt" }) }),
                        new Column({ width: "5rem", hAlign: "End", minScreenWidth: "Desktop", header: new Text({ text: "Menge" }) }),
                        new Column({ width: "7rem", hAlign: "End", minScreenWidth: "Tablet", header: new Text({ text: "Stückpreis" }) }),
                        new Column({ width: "8rem", hAlign: "End", header: new Text({ text: "Gesamt" }) }),
                        new Column({ width: "8rem", hAlign: "Center", header: new Text({ text: "Status" }) })
                    ]
                });

                var oTemplate = new ColumnListItem({
                    cells: [
                        new Text({ text: "{orderId}" }),
                        new Text({ text: "{date}" }),
                        new Text({ text: "{customer}" }),
                        new Text({ text: "{region}" }),
                        new Text({ text: "{category}" }),
                        new Text({ text: "{product}" }),
                        new ObjectNumber({ number: "{quantity}" }),
                        new ObjectNumber({ number: "{unitPrice}", unit: "EUR" }),
                        new ObjectNumber({ number: "{totalAmount}", unit: "EUR", emphasized: true }),
                        new ObjectStatus({
                            text: "{status}",
                            state: {
                                path: "status",
                                formatter: function (s) {
                                    return s === "Geliefert" ? "Success" : s === "Versandt" ? "Warning" : s === "In Bearbeitung" ? "Information" : "None";
                                }
                            }
                        })
                    ]
                });

                oTable.setModel(oModel);
                oTable.bindItems("/salesDetails", oTemplate);

                oSearchField.attachSearch(function (oEvent) {
                    var sQuery = oEvent.getParameter("query") || oEvent.getParameter("newValue") || "";
                    var aFilters = [];
                    if (sQuery) {
                        aFilters.push(new Filter({
                            filters: [
                                new Filter("orderId", FilterOperator.Contains, sQuery),
                                new Filter("customer", FilterOperator.Contains, sQuery),
                                new Filter("product", FilterOperator.Contains, sQuery),
                                new Filter("region", FilterOperator.Contains, sQuery)
                            ],
                            and: false
                        }));
                    }
                    oTable.getBinding("items").filter(aFilters);
                });

                // ── Page Assembly ──
                var oPage = new Page({
                    title: "Sales Analytics Dashboard",
                    showNavButton: false,
                    content: [oKpiGrid, oTrendHtml, oChartsGrid, oTable]
                }).addStyleClass("dashboardPage sapUiContentPadding");

                new Shell({ app: new App({ pages: [oPage] }) }).placeAt("content");
            });
        }
    </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
